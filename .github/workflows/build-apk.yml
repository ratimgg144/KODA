
name: Build KODA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run ENET protocol tests
        run: bash scripts/check_core.sh

      - name: Compile Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KODA-v0.2-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
